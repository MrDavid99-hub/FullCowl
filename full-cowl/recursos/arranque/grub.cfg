# Full Cowl - mini-ISO de arranque para Ubuntu (ficha 26)
# Lo unico que hace: arrancar la ISO de Ubuntu que esta en OTRO CD de la maquina anadiendo "autoinstall"
# a la linea del nucleo, para que el instalador no pregunte "Continue with autoinstall? (yes|no)".
# No lleva nada del PC ni ninguna ruta. Se rehace con hacer-iso.sh.
# (Sin tildes: la consola de GRUB no las pinta.)

set timeout=0
set pager=0

# Todo lo necesario se carga ANTES de cambiar de controladores de disco
insmod iso9660
insmod udf
insmod part_msdos
insmod part_gpt
insmod search
insmod search_fs_file
insmod test
insmod echo
insmod sleep
insmod linux
insmod halt

set fc_ok=0
set fc_dev=""
set fc_nucleo=""

function fc_buscar {
    if search --no-floppy --file --set=fc_dev /casper/vmlinuz; then
        set fc_nucleo=/casper/vmlinuz
        set fc_ok=1
    elif search --no-floppy --file --set=fc_dev /casper/hwe-vmlinuz; then
        set fc_nucleo=/casper/hwe-vmlinuz
        set fc_ok=1
    fi
}

# Con BIOS, GRUB solo ve el CD del que ha arrancado: hay que pasar a sus propios controladores
# (IDE y SATA) para ver los demas. Con EFI el firmware suele ensenar todos los CD; si no, se hace lo mismo.
if [ "${grub_platform}" = "pc" ]; then
    nativedisk pata ahci
    fc_buscar
else
    fc_buscar
    if [ "${fc_ok}" != "1" ]; then
        nativedisk pata ahci
        fc_buscar
    fi
fi

if [ "${fc_ok}" = "1" ]; then
    set root="${fc_dev}"
    set fc_initrd=""
    if [ "${fc_nucleo}" = "/casper/hwe-vmlinuz" -a -f /casper/hwe-initrd ]; then
        set fc_initrd=/casper/hwe-initrd
    elif [ -f /casper/initrd ]; then
        set fc_initrd=/casper/initrd
    elif [ -f /casper/initrd.lz ]; then
        set fc_initrd=/casper/initrd.lz
    elif [ -f /casper/initrd.gz ]; then
        set fc_initrd=/casper/initrd.gz
    fi
    if [ -n "${fc_initrd}" ]; then
        echo "Full Cowl: arrancando el instalador de Ubuntu sin preguntas (autoinstall)..."
        linux "${fc_nucleo}" autoinstall ---
        initrd "${fc_initrd}"
        boot
    fi
fi

echo ""
echo "FULL COWL: no he podido arrancar el CD de Ubuntu desde el CD de arranque."
echo "  1. En Full Cowl, pulsa Cancelar en la creacion de la base."
echo "  2. En Crear base, desmarca 'Empezar sin escribir yes' y vuelve a crearla:"
echo "     se hara como siempre, escribiendo yes cuando lo pida."
echo ""
echo "Esta pantalla se queda asi. Dispositivos que veo:"
ls
sleep 86400
halt
